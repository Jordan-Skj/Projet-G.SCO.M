{% load static %}
    <header>

        <div class="logo">
            <a href="{% url 'home:index' %}#hero" aria-label="Retour à l'accueil G.SCO.M">
                <div class="logo_content">
                    <img src="{% static 'assets/image/LOGO_GSCOM.png' %}" alt="Logo G.SCO.M">
                    <p>G.SCO.M</p>
                </div>
            </a>
        </div>

        <!-- Navigation principale (desktop) -->
        <nav aria-label="Navigation principale">
            <ul>
                <li><a href="{% url 'home:index' %}#hero">Accueil</a></li>
                <li><a href="{% url 'home:index' %}#news">Actualités</a></li>
                <li><a href="{% url 'home:index' %}#about">À propos</a></li>
                <li><a href="{% url 'home:index' %}#formation">Formation</a></li>
                <li><a href="{% url 'home:index' %}#vie_scolaire">Vie scolaire</a></li>
                <li><a href="{% url 'home:index' %}#contact">Contact</a></li>
            </ul>
        </nav>

        <div class="header-actions">
            <button type="button" class="theme-toggle" hidden aria-label="Activer le mode sombre" aria-pressed="false">
                <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/></svg>
                <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
            </button>
        <!-- Bouton hamburger visible uniquement sur mobile -->
        <button type="button" class="menu-toggle" aria-controls="mobileMenu" aria-expanded="false" aria-label="Ouvrir le menu" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>

        </div>
    </header>

    <!-- Menu mobile déroulant (caché par défaut, visible après clic sur hamburger) -->
    <div class="mobile-menu" id="mobileMenu">
        <ul>
            <li><a href="{% url 'home:index' %}#hero" onclick="toggleMenu()">Accueil</a></li>
            <li><a href="{% url 'home:index' %}#news" onclick="toggleMenu()">Actualités</a></li>
            <li><a href="{% url 'home:index' %}#about" onclick="toggleMenu()">À propos</a></li>
            <li><a href="{% url 'home:index' %}#formation" onclick="toggleMenu()">Formation</a></li>
            <li><a href="{% url 'home:index' %}#vie_scolaire" onclick="toggleMenu()">Vie scolaire</a></li>
            <li><a href="{% url 'home:index' %}#contact" onclick="toggleMenu()">Contact</a></li>
        </ul>
    </div>
