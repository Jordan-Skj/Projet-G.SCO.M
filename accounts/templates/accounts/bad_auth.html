{% extends "base.html" %}

{% block title %}Accès refusé — G.S.CO.M{% endblock %}

{% block content %}
<main class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 py-12">
    <div class="text-center max-w-md">
        <div class="mx-auto h-20 w-20 rounded-full bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 flex items-center justify-center mb-6">
            <svg class="h-10 w-10" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/>
            </svg>
        </div>

        <h1 class="text-2xl font-bold mb-3">Accès non autorisé</h1>
        <p class="text-gray-600 dark:text-gray-400 mb-8">
            {{ error|default:"Vous n'avez pas les droits nécessaires pour accéder à cette page." }}
        </p>

        <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
            <a href="{% url 'account:parent_login' %}" class="inline-flex items-center gap-2 bg-[#D95745] hover:bg-[#c94b3a] text-white font-semibold px-6 py-3 rounded-lg transition">
                Essayer un autre compte
            </a>
            <a href="/" class="inline-flex items-center gap-2 border border-gray-300 dark:border-gray-700 hover:border-[#D95745] hover:text-[#D95745] font-medium px-6 py-3 rounded-lg transition">
                Retour à l'accueil
            </a>
        </div>
    </div>
</main>
{% endblock %}
